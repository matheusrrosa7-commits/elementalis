    <!-- ===== TELA: HISTÓRICO ===== -->
    <section id="tela-historico" class="tela oculta">
      <h3>Últimos 7 dias</h3>
      <div class="legenda">
        <span><i class="ar on"></i>Ar</span><span><i class="terra on"></i>Terra</span>
        <span><i class="agua on"></i>Água</span><span><i class="fogo on"></i>Fogo</span>
      </div>
      <div id="lista-hist"></div>
    </section>

    <!-- ===== TELA: CONFIGURAÇÕES ===== -->
    <section id="tela-config" class="tela oculta">
      <h3>Personalize seu dia</h3>
      <label>Horário que acorda (Ar) <input type="time" id="cfg-acordar"></label>
      <label>Primeira refeição (Terra) <input type="time" id="cfg-refeicao"></label>
      <label>Horário que vai dormir <input type="time" id="cfg-dormir"></label>
      <label>Lembrar de beber água a cada (min) <input type="number" id="cfg-intervalo" min="1" max="360"></label>
      <button id="btn-notif" type="button">Ativar notificações</button>
      <button id="btn-teste" type="button" class="sec">Testar alarme de água</button>
    </section>
  </main>

  <!-- Menu fixo embaixo, com ícones de linha como no cartaz (data-tela = qual tela abrir) -->
  <nav class="menu">
    <button data-tela="inicio" class="ativo" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Início</span>
    </button>
    <button data-tela="historico" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></svg>
      <span>Histórico</span>
    </button>
    <button data-tela="config" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span>Config.</span>
    </button>
  </nav>

  <!-- ===== ALARME DE ÁGUA (sem texto e sem sino) ===== -->
  <div id="alarme" class="oculta">
    <div class="alarme-box">
      <!-- role/aria-* só ajudam leitores de tela e teclado; não aparecem na tela -->
      <svg id="dial" viewBox="0 0 240 240" tabindex="0" role="slider"
           aria-label="Arraste em círculo para desligar o alarme de água"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <defs>
          <!-- Recorte circular: a água do centro só aparece dentro da esfera -->
          <clipPath id="clipOrbe"><circle cx="120" cy="120" r="70"/></clipPath>
          <!-- Cores da água que corre pelo anel -->
          <linearGradient id="gAgua" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#1c8fd6"/>
          </linearGradient>
          <radialGradient id="gOrbe" cx=".4" cy=".35" r=".85">
            <stop offset="0" stop-color="#2a6f9e"/><stop offset="1" stop-color="#0a2540"/>
          </radialGradient>
        </defs>

        <!-- Ondas de pulso que se espalham a partir da esfera -->
        <circle class="pulso" cx="120" cy="120" r="70"/>
        <circle class="pulso p2" cx="120" cy="120" r="70"/>

        <!-- Esfera de água no centro: nível fixo, só pulsa (não enche mais) -->
        <g class="orbe">
          <circle cx="120" cy="120" r="70" fill="url(#gOrbe)"/>
          <g clip-path="url(#clipOrbe)">
            <g class="orbe-nivel segunda"><g class="onda-dial reversa">
              <path d="M0 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0V260H0Z"/>
            </g></g>
            <g class="orbe-nivel"><g class="onda-dial">
              <path d="M0 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0q10-7 20 0t20 0V260H0Z"/>
            </g></g>
          </g>
          <circle class="orbe-borda" cx="120" cy="120" r="70"/>
        </g>

        <!-- Anel: trilho cinza + ÁGUA que corre por ele até onde você arrastou (o JS desenha os 2 caminhos) -->
        <circle class="trilho" cx="120" cy="120" r="104"/>
        <path id="agua-banda" class="agua-banda"/>
        <path id="agua-brilho" class="agua-brilho"/>
        <circle id="agua-inicio" class="agua-inicio" cx="120" cy="16" r="7"/>

        <!-- Bolinha que você arrasta (o JS move ela em volta do anel) -->
        <g id="puxador" transform="translate(120 16)">
          <circle class="p-sombra" r="17" cy="4"/>
          <circle class="p-corpo" r="17"/>
          <circle class="p-miolo" r="5"/>
        </g>
      </svg>
    </div>
  </div>
<audio id="musica-fundo" src="audio/avatar.mp3" loop></audio>
  <script src="script.js"></script>
